<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="1. Alanya Mahalle Ligi Dr. Ali Nazım Köseoğlu Sezonu: 44 mahalle, canlı skorlar, puan durumu, fikstür, gol krallığı ve final yolu.">

<meta property="og:description" content="44 mahalle, 8 grup, tek kupa. Canlı skorlar, puan durumu, fikstür ve istatistikler.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: stadyum tabelası gibi yoğun kondanse başlıklar + deniz/sur tonları; hero'da skorbord, altta sekmeli fikstür, grup tabloları, final ağacı */
:root{
  --bg:#eaf1f1; --surface:#ffffff; --surface-2:#f4f8f8; --ink:#0d2330; --muted:#566a74; --line:#d3dfe0;
  --accent:#b8381f;          /* Kızılkule tuğlası */
  --sea:#0b6f7a;             /* Alanya koyu turkuaz */
  --board:#0b1b26; --board-ink:#eaf6f4; --board-dim:#7fa3ab; --led:#ffb547;
  --gA:#d23a2f; --gB:#e0701c; --gC:#b78a00; --gD:#2b8a3e; --gE:#0f86b8; --gF:#2a5bd7; --gG:#7a3fc4; --gH:#c42b6b;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08141c; --surface:#0f202b; --surface-2:#132836; --ink:#e6f0f0; --muted:#8fa6ae; --line:#1f3846;
  --accent:#ef6a4c; --sea:#38bcc4; --board:#040c12; --board-ink:#eaf6f4; --board-dim:#6f949c; --led:#ffbd5c;
  --gA:#f0625a; --gB:#f59343; --gC:#c79a12; --gD:#4cbf62; --gE:#3bb3e3; --gF:#6b92ff; --gG:#a679ee; --gH:#ec5c99;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08141c; --surface:#0f202b; --surface-2:#132836; --ink:#e6f0f0; --muted:#8fa6ae; --line:#1f3846;
  --accent:#ef6a4c; --sea:#38bcc4; --board:#040c12; --board-ink:#eaf6f4; --board-dim:#6f949c; --led:#ffbd5c;
  --gA:#f0625a; --gB:#f59343; --gC:#c79a12; --gD:#4cbf62; --gE:#3bb3e3; --gF:#6b92ff; --gG:#a679ee; --gH:#ec5c99;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:.95;letter-spacing:.01em}
h2{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:900;text-transform:uppercase}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sea)}
.muted{color:var(--muted)}
a{color:var(--sea)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:900;font-size:1.35rem;text-transform:uppercase;letter-spacing:.02em;line-height:1;white-space:nowrap}
.brand small{display:block;font-size:.68rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
nav.links{margin-left:auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.links a{padding:7px 11px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.88rem;white-space:nowrap}
nav.links a:hover{background:var(--surface)}
@media (max-width:760px){nav.links{display:none}}

/* Hero */
.hero{padding-block:44px 36px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;align-items:center}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}}
.hero h1{font-size:clamp(3.4rem,10vw,7.4rem);font-weight:900;text-transform:uppercase;line-height:.84;letter-spacing:-.005em}
.hero h1 .n{color:var(--accent)}
.hero h1 .l2{display:block;-webkit-text-stroke:2px var(--ink);color:transparent}
.season{margin-top:18px;font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,2.6vw,1.8rem);text-transform:uppercase;letter-spacing:.04em;color:var(--sea)}
.lede{max-width:52ch;margin:10px 0 0;color:var(--muted);font-size:1.02rem}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:26px}
.fact b{display:block;font-family:var(--f-display);font-weight:900;font-size:2.4rem;line-height:1}
.fact span{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.live{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.85rem;font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* Scoreboard */
.board{background:var(--board);color:var(--board-ink);border-radius:16px;padding:22px 22px 18px;position:relative;overflow:hidden;
  box-shadow:0 20px 50px -24px color-mix(in srgb,var(--board) 80%,transparent)}
.board::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--board-ink) 9%,transparent) 1px,transparent 1.4px) 0 0/6px 6px;pointer-events:none}
.board>*{position:relative}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px dashed color-mix(in srgb,var(--board-ink) 22%,transparent);padding-bottom:12px}
.board-head .lbl{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--board-dim);font-weight:700}
.board-head .day{font-family:var(--f-display);font-weight:800;font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em}
.count{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px}
.count b{font-family:var(--f-display);font-weight:900;font-size:4.6rem;line-height:.9;color:var(--led);text-shadow:0 0 18px color-mix(in srgb,var(--led) 45%,transparent)}
.count span{font-family:var(--f-display);font-weight:800;font-size:1.4rem;text-transform:uppercase;color:var(--board-dim)}
.board ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.board li{display:grid;grid-template-columns:3.4rem minmax(0,1fr) auto minmax(0,1fr) 1.6rem;align-items:center;gap:8px;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--board-ink) 8%,transparent);font-weight:600;font-size:.92rem}
.board li .t{font-family:var(--f-display);font-weight:800;color:var(--led);font-size:1.05rem}
.board li .h{text-align:right;overflow-wrap:anywhere}
.board li .v{color:var(--board-dim);font-size:.75rem}
.board li .a{overflow-wrap:anywhere}
.board .note{margin:12px 0 0;font-size:.78rem;color:var(--board-dim)}

/* Sections */
section.block{padding-block:56px}
section.block+section.block{border-top:1px solid var(--line)}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 24px;margin-bottom:26px}
.sec-head p{margin:6px 0 0;max-width:60ch;color:var(--muted)}

/* Group pill */
.gp{display:inline-grid;place-items:center;width:1.55rem;height:1.55rem;border-radius:6px;font-family:var(--f-display);font-weight:900;font-size:.95rem;color:#fff;background:var(--g)}
[data-g="A"]{--g:var(--gA)}[data-g="B"]{--g:var(--gB)}[data-g="C"]{--g:var(--gC)}[data-g="D"]{--g:var(--gD)}
[data-g="E"]{--g:var(--gE)}[data-g="F"]{--g:var(--gF)}[data-g="G"]{--g:var(--gG)}[data-g="H"]{--g:var(--gH)}

/* Groups */
.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1050px){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.groups{grid-template-columns:1fr}}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.gcard header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:3px solid var(--g)}
.gcard header .letter{font-family:var(--f-display);font-weight:900;font-size:2.2rem;line-height:.8;color:var(--g)}
.gcard header h3{font-size:1.1rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.gcard header small{margin-left:auto;font-size:.72rem;color:var(--muted);font-weight:600}
table.st{width:100%;border-collapse:collapse;font-size:.86rem}
table.st th{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:7px 4px;text-align:center}
table.st th:nth-child(2){text-align:left}
table.st td{padding:7px 4px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.st td:first-child{width:1.8rem;font-weight:700;color:var(--muted)}
table.st td.tm{text-align:left;font-weight:600}
table.st td.tm button{all:unset;cursor:pointer;border-radius:3px}
table.st td.tm button:hover{color:var(--sea);text-decoration:underline}
table.st td.tm button:focus-visible{outline:2px solid var(--sea)}
table.st td.p{font-weight:800}
table.st tr.q td:first-child{color:var(--g);box-shadow:inset 3px 0 0 var(--g)}
.legend{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.legend i{width:3px;height:14px;background:var(--sea);display:inline-block}

/* Fixture */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;font-size:.86rem;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:7px;min-width:2.1rem;height:2.1rem;padding:0 9px;font-family:var(--f-display);font-weight:900;font-size:1rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--g,var(--ink));border-color:var(--g,var(--ink));color:#fff}
.chips button[data-g=""][aria-pressed="true"]{color:var(--bg)}
.search{flex:1 1 200px;min-width:0;max-width:300px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
@media (max-width:400px){.days{grid-template-columns:1fr}}
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.daycard.past{opacity:.62}
.daycard.today{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.daycard header{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.daycard header b{font-family:var(--f-display);font-weight:800;font-size:1.3rem;text-transform:uppercase}
.daycard header span{font-size:.8rem;color:var(--muted);font-weight:600}
.daycard header em{margin-left:auto;font-style:normal;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.m{display:grid;grid-template-columns:3rem minmax(0,1fr) 2.6rem minmax(0,1fr) 1.55rem;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);font-size:.9rem}
.m:first-of-type{border-top:0}
.m .t{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.m .h{text-align:right;font-weight:600;overflow-wrap:anywhere}
.m .a{font-weight:600;overflow-wrap:anywhere}
.m .s{text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem;background:var(--surface-2);border-radius:5px;padding:2px 0;font-variant-numeric:tabular-nums}
.m mark{background:color-mix(in srgb,var(--sea) 22%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.tbd{padding:8px 14px 0;font-size:.76rem;color:var(--muted)}
.bye{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.86rem}
.bye b{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bye span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-weight:600}
.bye .gp{width:1.3rem;height:1.3rem;font-size:.8rem}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* Mahallem */
.mine{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.mine{grid-template-columns:1fr}}
.picker{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.picker label{display:block;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:8px}
.picker select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-weight:600}
.team-id{margin-top:18px;display:flex;align-items:center;gap:12px}
.team-id .big{font-family:var(--f-display);font-weight:900;font-size:2.4rem;line-height:.9;text-transform:uppercase;overflow-wrap:anywhere}
.team-id small{display:block;color:var(--muted);font-weight:600;font-size:.82rem}
.path{margin-top:16px;display:grid;gap:8px}
.path div{padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:.86rem}
.path b{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sea)}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:4.6rem minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.timeline li.byeRow{background:transparent;border-style:dashed}
.timeline .tur{font-family:var(--f-display);font-weight:900;font-size:1.05rem;text-transform:uppercase;color:var(--muted);line-height:1}
.timeline .tur small{display:block;font-family:var(--f-body);font-weight:600;font-size:.7rem;letter-spacing:.06em}
.timeline .vs{font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.timeline .vs span{color:var(--muted);font-weight:500}
.timeline .when{text-align:right;font-size:.84rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.timeline .when b{display:block;color:var(--ink);font-size:.95rem}

/* Bracket */
.bracket-scroll{overflow-x:auto;padding-bottom:8px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:26px;min-width:860px}
.col h3{font-size:1.3rem;font-weight:900;text-transform:uppercase;margin-bottom:4px}
.col .cd{font-size:.78rem;color:var(--muted);margin-bottom:12px;font-weight:600}
.col .stack{display:flex;flex-direction:column;justify-content:space-around;gap:12px;height:calc(100% - 3.6rem)}
.ko{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:.86rem}
.ko .meta{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:.72rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ko .meta b{color:var(--accent)}
.ko .slot{display:flex;align-items:center;gap:8px;padding:6px 10px;font-weight:600}
.ko .slot+.slot{border-top:1px solid var(--line)}
.ko .slot .gp{width:1.3rem;height:1.3rem;font-size:.78rem}
.ko .slot .ref{font-family:var(--f-display);font-weight:800;color:var(--muted)}
.col:not(:last-child) .ko::after{content:"";position:absolute;right:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.ko.final{border:2px solid var(--accent)}
.ko.final .meta{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ko-note{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px 24px;font-size:.86rem;color:var(--muted)}
.ko-note b{color:var(--ink)}

/* Info */
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.info{grid-template-columns:1fr}}
.info article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.info h3{font-size:1.35rem;font-weight:900;text-transform:uppercase;margin-bottom:10px}
.info ul{margin:0;padding-left:1.1em;display:grid;gap:6px}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.info dt{font-weight:700;font-variant-numeric:tabular-nums}
.info dd{margin:0;color:var(--muted)}

footer{padding-block:34px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
footer b{font-family:var(--f-display);font-size:1.15rem;color:var(--ink);text-transform:uppercase}

/* Olay ikonları */
.ic{display:inline-block;vertical-align:-1px;flex:none}
.ic.g{width:10px;height:10px;border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 2px var(--surface),0 0 0 1px var(--ink)}
.ic.og{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 2px var(--surface),0 0 0 1px var(--accent)}
.ic.y{width:8px;height:11px;border-radius:1.5px;background:#f2c200}
.ic.r{width:8px;height:11px;border-radius:1.5px;background:#d7261e}
.ev{padding:0 14px 9px;margin-top:-4px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 20px;font-size:.76rem;color:var(--muted)}
.ev div{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev div:first-child{text-align:right;align-items:flex-end}
.ev span{display:inline-flex;align-items:center;gap:5px;overflow-wrap:anywhere}

/* İstatistik */
.leaders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1050px){.leaders{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.leaders{grid-template-columns:1fr}}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.lcard header{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
.lcard header h3{font-size:1.25rem;font-weight:900;text-transform:uppercase}
.lcard ol{list-style:none;margin:0;padding:4px 0}
.lcard li{display:grid;grid-template-columns:1.6rem minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 14px}
.lcard li .rk{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.lcard li .nm{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.lcard li .nm small{display:flex;align-items:center;gap:5px;color:var(--muted);font-weight:500;font-size:.76rem}
.lcard li .nm small .gp{width:1.05rem;height:1.05rem;font-size:.66rem;border-radius:4px}
.lcard li .c{font-family:var(--f-display);font-weight:900;font-size:1.5rem;font-variant-numeric:tabular-nums}
.lcard li:first-child .c{color:var(--accent)}
.lcard .none{padding:18px 14px;color:var(--muted);font-size:.86rem}

/* Kadro */
.squad{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.squad header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.squad header h3{font-size:1.3rem;font-weight:900;text-transform:uppercase}
.squad .tw{overflow-x:auto}
.squad table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:420px}
.squad th{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;text-align:center}
.squad th:nth-child(2),.squad td:nth-child(2){text-align:left}
.squad td{padding:8px 10px;border-top:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.squad td:first-child{font-family:var(--f-display);font-weight:800;color:var(--muted);width:2.6rem}
.squad td:nth-child(2){font-weight:600}
.squad td:nth-child(2) small{display:block;color:var(--muted);font-weight:500;font-size:.74rem}
.squad .none{padding:18px 16px;color:var(--muted);font-size:.88rem}
.timeline .sc{font-family:var(--f-display);font-weight:900;font-size:1.15rem;margin-left:6px;color:var(--accent)}

/* Yönetim */
.adminBtn{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.82rem;cursor:pointer}
.adminBtn i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.adminBtn.on i{background:#2b8a3e}
@media (max-width:760px){.adminBtn{margin-left:auto}}
.admin{background:var(--board);color:var(--board-ink);padding-block:30px;--line:color-mix(in srgb,var(--board-ink) 16%,transparent);--surface:color-mix(in srgb,var(--board-ink) 6%,var(--board));--surface-2:color-mix(in srgb,var(--board-ink) 10%,var(--board));--muted:var(--board-dim);--ink:var(--board-ink);--bg:var(--board)}
.admin h2{font-size:clamp(1.9rem,4vw,2.6rem)}
.admin .eyebrow{color:var(--led)}
.admin-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:960px){.admin-grid{grid-template-columns:1fr}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0;display:grid;gap:14px;align-content:start}
.pane h3{font-size:1.35rem;font-weight:900;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.fld{display:grid;gap:5px;min-width:0;flex:1 1 140px}
.fld.sm{flex:0 1 84px}
.fld>span{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);color:var(--ink);min-width:0}
.fld textarea{min-height:110px;resize:vertical;font-size:.88rem}
.scoreIn{display:flex;align-items:center;gap:10px;justify-content:center;padding:10px;border-radius:10px;background:var(--surface-2)}
.scoreIn .tn{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.scoreIn .tn:first-child{text-align:right}
.scoreIn input{width:3.4rem;text-align:center;font-family:var(--f-display);font-weight:900;font-size:1.8rem;padding:4px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--led)}
.btn{border:0;border-radius:8px;padding:9px 15px;font-weight:700;cursor:pointer;background:var(--led);color:#1b1206}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.warn{background:transparent;border:1px solid #d7261e;color:#ff7a70}
.btn:disabled{opacity:.5;cursor:default}
.evlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.evlist li{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;background:var(--surface-2);font-size:.88rem}
.evlist li .mn{font-variant-numeric:tabular-nums;color:var(--muted);width:2.4rem}
.evlist li .who{flex:1;min-width:0;overflow-wrap:anywhere}
.evlist li .who small{color:var(--muted)}
.evlist li button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:2px 6px}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.hint b{color:var(--ink)}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:3px;max-height:260px;overflow:auto}
.plist li{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;background:var(--surface-2);font-size:.86rem}
.plist li b{width:2rem;font-family:var(--f-display);color:var(--muted)}
.plist li span{flex:1;min-width:0;overflow-wrap:anywhere}
.plist li button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.78rem;font-weight:700}
.plist li button.arm{color:#ff7a70}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-block:18px;max-width:640px}
.gate h3{font-size:1.3rem;font-weight:900;text-transform:uppercase;margin-bottom:6px}
.gate p{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:50;max-width:calc(100% - 32px)}
.live-note{font-size:.78rem;color:var(--muted);margin-top:8px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth;scroll-padding-top:70px}

/* ===== v3 ekleri ===== */
.iconBtn{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.iconBtn svg{width:17px;height:17px}
@media (max-width:760px){
  .top .wrap{flex-wrap:wrap;row-gap:6px}
  nav.links{display:flex;order:3;width:100%;margin-left:0;padding-bottom:2px}
  nav.links a{padding:6px 10px;font-size:.84rem;background:var(--surface);border:1px solid var(--line)}
  .adminBtn{margin-left:auto}
}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:4px;white-space:nowrap}
.badge.live{background:#d7261e;color:#fff}
.badge.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
.badge.post{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge.ft{background:var(--surface-2);color:var(--muted)}
@keyframes blink{50%{opacity:.25}}
.m[data-match]{cursor:pointer}
.m[data-match]:hover{background:var(--surface-2)}
.m .s.live{background:#d7261e;color:#fff}
.m .s.post{font-size:.62rem;font-family:var(--f-body);font-weight:800;letter-spacing:.06em;color:var(--muted)}
.mvp{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:800;color:var(--accent);letter-spacing:.06em}

/* Form */
.form{display:inline-flex;gap:3px}
.form i{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;font-style:normal;font-size:.6rem;font-weight:800;color:#fff}
.form i.w{background:#2b8a3e}.form i.d{background:#8a96a0}.form i.l{background:#d7261e}
table.st th.fm,table.st td.fm{display:none}
@media (min-width:1300px){table.st th.fm,table.st td.fm{display:table-cell}}

/* Gündem */
.gundem{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.gundem{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel>header h3{font-size:1.3rem;font-weight:900;text-transform:uppercase}
.panel>header a{font-size:.82rem;font-weight:700;text-decoration:none}
.panel .none{padding:22px 16px;color:var(--muted);font-size:.9rem}
.res{display:grid;grid-template-columns:4.8rem minmax(0,1fr) 3rem minmax(0,1fr);gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:.9rem;cursor:pointer}
.res:first-of-type{border-top:0}
.res:hover{background:var(--surface-2)}
.res .d{font-size:.74rem;color:var(--muted);font-weight:600;line-height:1.2}
.res .h{text-align:right;font-weight:600;overflow-wrap:anywhere}
.res .a{font-weight:600;overflow-wrap:anywhere}
.res .s{text-align:center;font-family:var(--f-display);font-weight:900;font-size:1.15rem}
.res .win{color:var(--ink)}.res .lose{color:var(--muted);font-weight:500}

/* Duyurular */
.news{display:grid;gap:14px}
.newsItem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.newsItem.pin{border-color:var(--sea)}
.newsItem time{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.newsItem h3{font-size:1.45rem;font-weight:900;text-transform:uppercase;margin:4px 0 8px}
.newsItem p{margin:0;white-space:pre-line;max-width:70ch}
.newsMini{padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.newsMini:first-of-type{border-top:0}
.newsMini b{display:block;font-weight:700}
.newsMini span{font-size:.78rem;color:var(--muted)}

/* Takımlar */
.teamGrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-bottom:26px}
@media (max-width:1050px){.teamGrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.teamGrid{display:none}}
@media (max-width:420px){.brand small{display:none}.brand b{font-size:1.2rem}.adminBtn{padding:6px 10px}}
.teamGrid .col{display:grid;gap:4px;align-content:start;min-width:0}
.teamGrid .col b{font-family:var(--f-display);font-weight:900;font-size:1.1rem;color:var(--g);padding-bottom:2px;border-bottom:2px solid var(--g)}
.teamGrid button{all:unset;cursor:pointer;font-size:.84rem;font-weight:600;padding:3px 6px;border-radius:5px;overflow-wrap:anywhere}
.teamGrid button:hover{background:var(--surface)}
.teamGrid button[aria-current="true"]{background:var(--g);color:#fff}
.teamGrid button:focus-visible{outline:2px solid var(--sea)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.tile{background:var(--surface-2);border-radius:8px;padding:9px 10px}
.tile b{display:block;font-family:var(--f-display);font-weight:900;font-size:1.6rem;line-height:1}
.tile span{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tinfo{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.88rem}
.tinfo dt{color:var(--muted);font-weight:600}
.tinfo dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn.sm{padding:7px 12px;font-size:.84rem}
.btn.line{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.squad td .ban{display:inline-block;margin-left:6px;font-size:.66rem;font-weight:800;color:#fff;background:#d7261e;border-radius:3px;padding:1px 5px;letter-spacing:.04em}

/* Takım tabloları */
.teamStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
@media (max-width:900px){.teamStats{grid-template-columns:1fr}}
.subhead{font-size:1.5rem;font-weight:900;text-transform:uppercase;margin:34px 0 12px}

/* Maç penceresi */
dialog.modal{border:0;padding:0;border-radius:16px;max-width:min(560px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog.modal::backdrop{background:rgba(4,12,18,.6);backdrop-filter:blur(3px)}
.mhead{background:var(--board);color:var(--board-ink);padding:18px 20px 20px;position:relative}
.mhead .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.78rem;color:var(--board-dim);font-weight:600}
.mhead .close{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;border:0;background:color-mix(in srgb,var(--board-ink) 12%,transparent);color:var(--board-ink);font-size:1.2rem;cursor:pointer}
.mscore{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;margin-top:16px}
.mscore .tn{font-family:var(--f-display);font-weight:800;font-size:1.5rem;text-transform:uppercase;line-height:1;overflow-wrap:anywhere}
.mscore .tn:first-child{text-align:right}
.mscore .sc{font-family:var(--f-display);font-weight:900;font-size:3rem;color:var(--led);line-height:1;font-variant-numeric:tabular-nums}
.mscore .sc small{display:block;text-align:center;font-size:.8rem;color:var(--board-dim);letter-spacing:.08em}
.mbody{padding:16px 20px 20px;display:grid;gap:14px;max-height:60vh;overflow:auto}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tl li{display:grid;grid-template-columns:minmax(0,1fr) 2.6rem minmax(0,1fr);gap:8px;align-items:center;font-size:.88rem;padding:5px 0}
.tl li .mn{text-align:center;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.tl li .l{text-align:right;display:flex;justify-content:flex-end;gap:6px;align-items:center}
.tl li .r{display:flex;gap:6px;align-items:center}
.tl li small{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:.88rem}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}

/* Yönetim sekmeleri */
.atabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.atabs button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer}
.atabs button[aria-pressed="true"]{background:var(--led);color:#1b1206;border-color:var(--led)}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.nlist{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:320px;overflow:auto}
.nlist li{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;background:var(--surface-2);font-size:.86rem}
.nlist li span{flex:1;min-width:0;overflow-wrap:anywhere}
.nlist li button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.78rem;font-weight:700}
.nlist li button.arm{color:#ff7a70}
.plist li span{cursor:pointer}
.plist li span:hover{text-decoration:underline}

/* SSS */
.faq{display:grid;gap:8px;margin-top:16px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.faq summary{cursor:pointer;font-weight:700}
.faq p{margin:8px 0 0;color:var(--muted);max-width:70ch}
.liveBar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:#d7261e;color:#fff;padding:9px 16px;border-radius:10px;margin-bottom:18px;font-weight:700;cursor:pointer}
.liveBar span{display:inline-flex;gap:8px;align-items:center}

/* ===== v4: hesaplar, fotoğraflar, Alanya ===== */
.cnt{font-style:normal;display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#d7261e;color:#fff;font-size:.68rem;font-weight:800;margin-left:2px}
.photoIn{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.photoPrev{width:64px;height:64px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line);background-size:cover;background-position:center;flex:none}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2);display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.9rem;color:var(--muted);vertical-align:middle}
.av.lg{width:96px;height:96px;font-size:2.2rem;border-radius:20px;border:3px solid color-mix(in srgb,var(--board-ink) 20%,transparent)}
.pcell{display:flex;align-items:center;gap:10px}
.plink{all:unset;cursor:pointer;font-weight:600}
.plink:hover{text-decoration:underline}
.plink:focus-visible{outline:2px solid var(--sea)}
.teamLogo{width:2.6rem;height:2.6rem;border-radius:10px;object-fit:cover;flex:none}
.phead{display:flex;gap:16px;align-items:center;margin-top:4px}
.phead .nm{font-family:var(--f-display);font-weight:900;font-size:2rem;text-transform:uppercase;line-height:.95;overflow-wrap:anywhere}
.phead .sub{color:var(--board-dim);font-weight:600;font-size:.86rem;margin-top:6px}
.ptiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ptiles .tile b{font-size:1.4rem}
.gtabs{display:flex;gap:6px;margin:12px 0 4px}
.gtabs button{border:1px solid var(--line);background:transparent;padding:6px 12px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--ink)}
.gtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gate form{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:12px}
.gate .fld{flex:1 1 200px}
.chipsRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chipsRow .live{margin-top:0}
.live.sea i{background:var(--sea);animation:none}
.wx{margin:2px 0 4px;font-size:.8rem;color:var(--board-dim);font-weight:600}
.wx b{color:var(--board-ink)}
.skyline{display:block;width:100%;height:clamp(60px,9vw,110px);margin-top:28px}
.skyline .hill{fill:color-mix(in srgb,var(--sea) 18%,var(--bg))}
.skyline .wall{fill:none;stroke:color-mix(in srgb,var(--sea) 40%,var(--bg));stroke-width:2}
.skyline .kule path{fill:var(--accent)}
.skyline .wave{fill:var(--sea);opacity:.85}
.hero{padding-bottom:0}
@media (max-width:420px){.board{padding:18px 14px 14px}.board li{grid-template-columns:2.7rem minmax(0,1fr) auto minmax(0,1fr) 1.4rem;gap:6px;font-size:.8rem}.board li .h,.board li .a{overflow-wrap:normal;word-break:normal;hyphens:auto}.board li .t{font-size:.9rem}}
.reqRow{display:grid;gap:6px;padding:10px;border-radius:8px;background:var(--surface-2)}
.reqRow .row{gap:6px}
.reqRow select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
</style>
